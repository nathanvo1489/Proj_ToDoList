name: CI

on:
  pull_request:
    branches: [main, develop]

env:
  SSH_SERVER: ${{secrets.SSH_USER}}@${{secrets.IP_SERVER_RUN}}
  WORK_DIR: /home/ubuntu/Proj_ToDoList/backend
  COMPOSE_FILE_DIR: /home/ubuntu/Proj_ToDoList/docker-compose
  IMG_NAME: js_express_be_image:latest
  SERVICE_NAME: js_express_be

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.99.3
        
      - name: Check Dockerfile
        run: |
          ls -la
          cd $WORK_DIR
          test -f Dockerfile
      
      - name: Run Unit Test
        run: |
          echo "Running unit tests..."
          sleep 2
          echo "Unit tests completed successfully."

      - name: Check docker compose file
        run: |
          ssh  $SSH_SERVER "
            set -e
            cd $COMPOSE_FILE_DIR
            test -f docker-compose.yml
          "

 