services:
  # docker run --name mongodb -d -v ../mongo_data:/data/db -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD=12345 -p 27017:27017 mongo:latest
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - ../mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=12345

  # docker run --name js_express_be_container -d -p 8000:8001 --env-file=.env js_express_be_image
  js_express_be:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: js_express_be_image
    container_name: js_express_be
    ports:
      - 8000:8001
    env_file:
      - ../backend/.env
    depends_on:
      - mongodb

  # docker run --name js_react_fe_container -d -p 3001:80 js_react_fe_image
  js_react_fe:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: js_react_fe_image
    container_name: js_react_fe
    ports:
      - 3001:80
    # env_file:
    #   - ../frontend/.env
    depends_on:
      - js_express_be

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   ports:
  #     - 9090:9090
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  # grafana:
